<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sent-2 · Sentinel-2 imagery</title>
<meta name="description" content="Look at any place on Earth in free Sentinel-2 satellite imagery, merged from several dates into one sharper, cloud-free picture.">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#0d1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sent-2">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-mark">🛰️</span><span>Sent-2<small>sentinel-2 imagery</small></span></div>
  <div class="topbar-right">
    <span class="badge badge-demo" id="demoBadge" hidden>Demo data — synthetic</span>
    <span class="badge" id="sourceBadge">Sentinel-2 L2A</span>
    <button class="btn-install" id="installBtn" hidden title="Install Sent-2 as an app">
      <span>↓</span> Install app
    </button>
  </div>
</header>

<main class="layout">
  <aside class="sidebar" id="sidebar">

    <div class="group">
      <h3>1 · Where</h3>
      <div class="search-row">
        <input type="search" id="placeSearch" placeholder="Find a place…" autocomplete="off">
        <button class="btn btn-ghost" id="placeSearchBtn" title="Search">Go</button>
      </div>
      <div class="results" id="placeResults" hidden></div>
      <p class="hint">Drag and scroll the map freely. To choose an area, pick a
        shape below — it disarms itself once you have drawn one.</p>
      <div class="toolbar" id="drawTools">
        <button class="tool" data-draw="rect" title="Drag a box">▭ Box</button>
        <button class="tool" data-draw="circle" title="Drag out from the centre">◯ Circle</button>
        <button class="tool" data-draw="lasso" title="Freehand — drag to circle a region">✎ Lasso</button>
        <button class="tool" data-draw="polygon" title="Click corners, double-click to close">⬠ Polygon</button>
      </div>
      <div class="aoi-summary" id="aoiSummary">
        <em>Pick a shape, then draw on the map.</em>
      </div>
      <div class="row">
        <button class="btn btn-ghost btn-sm" id="clearAoi">Clear</button>
        <button class="btn btn-ghost btn-sm" id="zoomAoi">Zoom to area</button>
      </div>
    </div>

    <div class="group">
      <h3>2 · When</h3>
      <div class="field-row">
        <label>From<input type="date" id="dateStart"></label>
        <label>To<input type="date" id="dateEnd"></label>
      </div>
      <div id="cloudSlider"></div>
      <button class="btn btn-primary" id="searchDates" disabled>Find dates</button>
      <div class="row">
        <button class="btn btn-ghost btn-sm" id="selectClearest">Tick 6 clearest</button>
        <button class="btn btn-ghost btn-sm" id="selectNone">Untick all</button>
      </div>
      <div class="scene-list" id="dateList"></div>
      <p class="hint" id="mergeHint"></p>
    </div>

    <div class="group">
      <h3>3 · Show</h3>
      <label class="field">Visualisation
        <select id="renderMode">
          <optgroup label="Band combinations" id="optComposites"></optgroup>
          <optgroup label="Spectral indices" id="optIndices"></optgroup>
        </select>
      </label>
      <p class="hint" id="renderHint"></p>
      <label class="field">Size
        <select id="renderSize">
          <option value="512">512 px — quick look</option>
          <option value="1024" selected>1024 px — standard</option>
          <option value="2048">2048 px — detailed</option>
          <option value="4096">4096 px — maximum (slow)</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="maskClouds" checked> Mask clouds &amp; shadows</label>
      <label class="check"><input type="checkbox" id="clipShape" checked> Clip to my shape</label>
      <button class="btn btn-primary btn-big" id="showBtn" disabled>Show imagery</button>
      <div class="row">
        <button class="btn btn-ghost btn-sm" id="downloadTif" disabled>GeoTIFF</button>
        <button class="btn btn-ghost btn-sm" id="downloadPng" disabled>PNG</button>
      </div>
    </div>

    <div class="group">
      <h3>4 · Make it look better</h3>
      <div id="renderSliders"></div>
      <div class="presets presets-wide" id="enhancePresets"></div>
      <div id="enhanceSliders"></div>
      <button class="btn btn-ghost btn-sm" id="enhanceReset">Reset</button>
    </div>
  </aside>

  <section class="stage">
    <div id="map"></div>
    <div class="map-hint" id="mapHint"></div>
    <div class="map-legend" id="mapLegend" hidden></div>
    <div class="opacity-dock" id="opacityDock" hidden>
      <label>Imagery <input type="range" id="overlayOpacity" min="0" max="100" value="100"></label>
      <button class="btn btn-ghost btn-sm" id="toggleOverlay">Hide</button>
    </div>
  </section>
</main>

<div class="toast-dock" id="toasts"></div>
<div class="busy" id="busy" hidden><div class="spinner"></div><span id="busyText">Working…</span></div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
