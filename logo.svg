<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EarthViewer">
  <title>EarthViewer</title>
  <defs><clipPath id="globe"><circle cx="32" cy="32" r="21"/></clipPath></defs>
  <!-- The swath: the strip of ground one pass records, curved so it lies on
       the sphere rather than cutting across it. -->
  <path d="M -8,50 Q 32,31 72,10" stroke="#37e0a0" stroke-width="9.5" fill="none"
        clip-path="url(#globe)"/>
  <!-- One meridian, so the circle reads as a globe rather than a ring. -->
  <ellipse cx="32" cy="32" rx="8.5" ry="21" fill="none" stroke="#4cc2ff"
           stroke-width="2.4" opacity=".6"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#4cc2ff" stroke-width="4"/>
</svg>
